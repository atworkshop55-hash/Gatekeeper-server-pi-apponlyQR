name: Server source tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 -B -m unittest discover -s test -p '*_test.py'
      - run: node --test test/reference-platform.test.js
      - run: |
          sh -n install.sh
          bash -n deployment/install-backend
          bash -n deployment/install-enrollment-tools
          sh -n scripts/gatekeeper-enroll-command
      - run: python3 -B scripts/install-server --plan --host ci-server.local
